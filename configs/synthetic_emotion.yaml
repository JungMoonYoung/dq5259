# 합성 데이터 (감정이 태깅된 자유대화 라벨 구조를 본뜬 결함 주입 데이터)
dataset:
  name: 합성 — 감정 자유대화 (결함 주입)
  type: audio
  root: ../samples/emotion
  source_ext: [.wav]

fields:
  empty_check: Conversation
  categories: Conversation[].SpeakerEmotionCategory
  required:
    - Speaker1.Gender
    - Speaker1.Age
    - Conversation[].SpeakerEmotionCategory
  unit_items: Conversation[]
  unit_label: SpeakerEmotionCategory
  unit_group: ^{SpeakerNo}.Gender  # 발화자의 성별 그룹 간 감정 라벨 비율 비교
  person_items: [Speaker1, Speaker2]
  quasi_identifiers: [Gender, Age, Residence, Occupation]

measures:
  Div-ML-3: {min_count: 10}
  Idn-ML-1: {k: 5}
